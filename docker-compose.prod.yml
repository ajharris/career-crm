services:
  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://career_crm:${POSTGRES_PASSWORD}@db:5432/career_crm
    volumes: ["uploads:/app/instance/uploads"]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "flask db upgrade && gunicorn --config gunicorn.conf.py wsgi:app"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_crm
      POSTGRES_USER: career_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U career_crm"], interval: 5s, timeout: 5s, retries: 10}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {SERVER_NAME: "${SERVER_NAME}"}
    volumes: ["./nginx.conf:/etc/nginx/templates/default.conf.template:ro", "${TLS_CERT_DIR}:/etc/nginx/certs:ro", "./app/static:/app/app/static:ro"]
    depends_on: [web]
volumes: {postgres_data: {}, uploads: {}}
