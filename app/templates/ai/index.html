{% extends "base.html" %}{% block title %}AI Assistant · Career CRM{% endblock %}{% block content %}<h1 class="h2">Optional AI assistance</h1><p class="text-body-secondary">Nothing is sent to an AI provider until you submit this form. Review generated text before using it.</p><form method="post" class="card border-0 shadow-sm"><div class="card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Application</label><select class="form-select mb-3" name="application_id" required>{% for a in applications %}<option value="{{ a.id }}">{{ a.job_posting.title }} · {{ a.job_posting.organization.name }}</option>{% endfor %}</select><label class="form-label">Task</label><select class="form-select mb-3" name="task">{% for value,label in [('cover_letter','Cover letter draft'),('resume','Resume tailoring'),('job_summary','Job summary'),('match','Match explanation'),('company','Company summary'),('interview','Interview preparation')] %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><label class="form-label">Additional context</label><textarea class="form-control mb-3" name="notes" rows="5"></textarea><button class="btn btn-primary">Generate</button></div></form>{% if result %}<section class="card border-0 shadow-sm mt-4"><div class="card-body"><h2 class="h5">Draft</h2><div class="text-pre-wrap">{{ result }}</div></div></section>{% endif %}{% endblock %}
