{% macro task_list(tasks) %}<div class="list-group list-group-flush">{% for task in tasks %}<a class="list-group-item list-group-item-action d-flex justify-content-between" href="{{ url_for('tasks.detail', task_id=task.id) }}"><span>{{ task.title }} · {{ task.priority.label }}</span><span class="{{ 'text-danger fw-semibold' if task.is_overdue }}">{{ task.due_date or 'No due date' }}</span></a>{% else %}<div class="text-body-secondary py-3">No tasks.</div>{% endfor %}</div>{% endmacro %}
