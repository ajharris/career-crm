{% extends "base.html" %}{% block title %}Notifications · Career CRM{% endblock %}{% block content %}<h1 class="h2 mb-4">Notifications</h1>{% for item in notifications %}<div class="alert alert-{{ item.level }} d-flex justify-content-between align-items-center"><div><a class="alert-link" href="{{ item.url }}">{{ item.title }}</a><br>{{ item.message }}</div><form method="post" action="{{ url_for('notifications.dismiss') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="key" value="{{ item.key }}"><button class="btn-close" aria-label="Dismiss"></button></form></div>{% else %}<div class="card card-body border-0 shadow-sm">You're all caught up.</div>{% endfor %}{% endblock %}
