services:
  web:
    build: .
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql+psycopg://career_crm:career_crm@db:5432/career_crm
    ports: ["5000:8000"]
    volumes: [".:/app", "uploads:/app/instance/uploads"]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "flask db upgrade && gunicorn --reload --bind 0.0.0.0:8000 wsgi:app"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: career_crm
      POSTGRES_USER: career_crm
      POSTGRES_PASSWORD: career_crm
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U career_crm"], interval: 5s, timeout: 5s, retries: 10}
volumes: {postgres_data: {}, uploads: {}}
